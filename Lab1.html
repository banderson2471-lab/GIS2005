<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>ArcGIS Maps SDK for JavaScript Tutorials: Display a map</title>

    <style>
      
      html,
      body {
        height: 100%;
        margin: 0;
      }
      arcgis-map {
      width: 800px;
      height: 400px;
      }
    </style>  

    <!-- Load the ArcGIS Maps SDK for JavaScript from CDN -->
    <script type="module" src="https://js.arcgis.com/5.1/"></script>

  </head>


  <body>

    <banner>
      
      <img src=https://raw.githubusercontent.com/banderson2471-lab/GIS2005/refs/heads/main/flatirons.jpeg>
      </img>
      
    </banner>
    

    <arcgis-map item-id="0b6cd7de9f8f4d5091184883874fcef3" center="-105.291636, 40.005519" zoom="16">

      <arcgis-zoom slot="top-left"></arcgis-zoom>

    </arcgis-map>
    <script type="module">
        const viewElement = document.querySelector("arcgis-map");
        const locString = window.location;
        console.log("locString=" + locString);
        const urlParams = new URLSearchParams(locString.search);
        let resort = urlParams.get("resort");
        console.log(resort);
        if (resort=="winterpark") {
            viewElement.goTo(
                // go to point with a custom animation duration
                { center: [-105.76, 39.89] },
                { duration: 5000 },
            );
            viewElement.zoom = 15;
            
        }
        if (resort=="vail") {
            viewElement.goTo(
                // go to point with a custom animation duration
                { center: [-106.37, 39.64] },
                { duration: 5000 },
            );
            viewElement.zoom = 15;
        }
        
        
    </script>
    <p>
      The above map displays hiking trails, trailheads, and climbing formations around 
      Boulder, CO. Follow the purple hiker to find trailheads. Orange lines will accommodate
      horses, while brown lines will not. Look for the red carabiners to find some of our iconic 
      climbing spots. Happy Trails!
    </p>
  </body>

</html>
